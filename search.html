---
title: Search
description: "Search every article on Voice of God."
permalink: /search/
layout: default
---
<section class="search wrap" data-search data-index="{{ '/search.json' | relative_url }}">
  <header class="archive__header">
    <p class="kicker">Search</p>
    <h1 class="archive__title">Find an article</h1>
    <p class="archive__count">
      Search titles, topics, and full text. Press <kbd>/</kbd> anywhere on the
      site to come straight here.
    </p>
  </header>

  <form class="search__form" role="search" action="{{ '/search/' | relative_url }}" method="get">
    <label class="sr-only" for="search-input">Search articles</label>
    <input class="search__input"
           id="search-input"
           type="search"
           name="q"
           placeholder="Try &quot;attention&quot; or &quot;static sites&quot;"
           autocomplete="off"
           spellcheck="false"
           data-search-input>
    <button class="btn" type="submit">Search</button>
  </form>

  <p class="search__status" data-search-status aria-live="polite"></p>

  <div class="search__results" data-search-results></div>

  <p class="search__empty" data-search-empty hidden>
    Nothing matched that search. Try fewer or different words.
  </p>
</section>

<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
