{% if site.comments.enabled and site.comments.repo_id != "" %}
<aside class="comments wrap wrap--narrow" aria-labelledby="comments-title">
  <h2 class="comments__title" id="comments-title">Join the conversation</h2>
  <p class="comments__note">
    Comments are powered by GitHub Discussions &mdash; sign in with a GitHub
    account to take part.
  </p>
  <script src="https://giscus.app/client.js"
          data-repo="{{ site.comments.repo }}"
          data-repo-id="{{ site.comments.repo_id }}"
          data-category="{{ site.comments.category }}"
          data-category-id="{{ site.comments.category_id }}"
          data-mapping="{{ site.comments.mapping }}"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="light"
          data-lang="en"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
</aside>
{% endif %}
