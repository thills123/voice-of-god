{% if paginator.total_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if paginator.previous_page %}
    <a class="pagination__link" href="{{ paginator.previous_page_path | relative_url }}" rel="prev">
      <span aria-hidden="true">&larr;</span> Newer
    </a>
  {% else %}
    <span class="pagination__link is-disabled" aria-hidden="true"><span>&larr;</span> Newer</span>
  {% endif %}

  <span class="pagination__status">Page {{ paginator.page }} of {{ paginator.total_pages }}</span>

  {% if paginator.next_page %}
    <a class="pagination__link" href="{{ paginator.next_page_path | relative_url }}" rel="next">
      Older <span aria-hidden="true">&rarr;</span>
    </a>
  {% else %}
    <span class="pagination__link is-disabled" aria-hidden="true">Older <span>&rarr;</span></span>
  {% endif %}
</nav>
{% endif %}
