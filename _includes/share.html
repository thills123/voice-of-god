{% assign share_url = page.url | absolute_url %}
{% assign share_url_encoded = share_url | url_encode %}
{% assign share_title = page.title | url_encode %}

<section class="share" aria-label="Share this article">
  <p class="share__label">Share</p>
  <div class="share__links">
    <a class="share__link"
       href="https://twitter.com/intent/tweet?url={{ share_url_encoded }}&amp;text={{ share_title }}"
       target="_blank" rel="noopener noreferrer">X / Twitter</a>

    <a class="share__link"
       href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url_encoded }}"
       target="_blank" rel="noopener noreferrer">LinkedIn</a>

    <a class="share__link" href="mailto:?subject={{ share_title }}&amp;body={{ share_url_encoded }}">Email</a>

    <button class="share__link share__link--copy" type="button" data-copy="{{ share_url }}">
      Copy link
    </button>
  </div>
</section>
