{% if page.previous or page.next %}
<nav class="post-nav wrap" aria-label="More articles">
  {% if page.next %}
    <a class="post-nav__item" href="{{ page.next.url | relative_url }}" rel="next">
      <span class="post-nav__label">&larr; Newer article</span>
      <span class="post-nav__title">{{ page.next.title }}</span>
    </a>
  {% else %}
    <span class="post-nav__item post-nav__item--empty" aria-hidden="true"></span>
  {% endif %}

  {% if page.previous %}
    <a class="post-nav__item post-nav__item--next" href="{{ page.previous.url | relative_url }}" rel="prev">
      <span class="post-nav__label">Older article &rarr;</span>
      <span class="post-nav__title">{{ page.previous.title }}</span>
    </a>
  {% endif %}
</nav>
{% endif %}
